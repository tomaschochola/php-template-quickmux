name: 'template-php-quickmux-devcontainer'

networks:
    devcontainer:
        internal: false
    mysql:
        internal: true
    valkey:
        internal: true

secrets:
    db_password:
        file: './mysql_password'
    db_root_password:
        file: './mysql_password'

services:
    devcontainer:
        build:
            context: './'
            dockerfile: 'Dockerfile'
        command:
            - 'sleep'
            - 'infinity'
        depends_on:
            mysql:
                condition: 'service_healthy'
                restart: true
            valkey:
                condition: 'service_healthy'
                restart: true
        environment:
            APP_ENV: 'local'
            MYSQL_DATABASE: 'db'
            MYSQL_HOST: 'mysql'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_USER: 'db'
            NODE_ENV: 'development'
        init: true
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'devcontainer'
            - 'mysql'
            - 'valkey'
        ports:
            - '61060:61060'
            - '127.0.0.1:61061-61062:61061-61062'
            - '61063:61063'
            - '127.0.0.1:61064-61069:61064-61069'
        restart: 'always'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        volumes:
            - bind:
                  create_host_path: false
              source: '..'
              target: '/workspace'
              type: 'bind'
        working_dir: '/workspace'

    mysql:
        environment:
            MYSQL_DATABASE: 'db'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_USER: 'db'
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'mysqladmin', 'ping', '--host=127.0.0.1', '--silent']
            timeout: '5s'
        image: 'docker.io/library/mysql:8.4.11@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'mysql'
        restart: 'always'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        stop_grace_period: '60s'
        volumes:
            - source: 'mysql_data'
              target: '/var/lib/mysql'
              type: 'volume'

    valkey:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '10s'
            test: ['CMD', 'valkey-cli', 'ping']
            timeout: '5s'
        image: 'docker.io/valkey/valkey:9.1.2-trixie@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'valkey'
        restart: 'always'
        shm_size: '128mb'
        stop_grace_period: '30s'
        volumes:
            - source: 'valkey_data'
              target: '/data'
              type: 'volume'

volumes:
    mysql_data:
    valkey_data:
