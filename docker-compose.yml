networks:
  nginx:
    internal: false
  oracle:
    internal: true
  php:
    internal: true
  valkey:
    internal: true
secrets:
  oracle_pwd:
    file: './.secrets/oracle_pwd'
services:
  nginx:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'nginx'
    cap_drop:
      - 'ALL'
    depends_on:
      php:
        condition: 'service_healthy'
    healthcheck:
      interval: '10s'
      retries: 3
      start_period: '30s'
      test:
        - 'CMD-SHELL'
        - 'curl -fsSL http://localhost:8080/nginx_ping | grep -q pong || exit 1'
      timeout: '5s'
    logging:
      driver: 'json-file'
      options:
        max-file: 3
        max-size: '10m'
    networks:
      - 'nginx'
      - 'php'
    read_only: true
    restart: 'unless-stopped'
    security_opt:
      - 'no-new-privileges:true'
    stop_grace_period: '60s'
    sysctls:
      - 'net.core.somaxconn=65535'
      - 'net.ipv4.ip_local_port_range=1024 65535'
      - 'net.ipv4.tcp_fin_timeout=15'
      - 'net.ipv4.tcp_tw_reuse=1'
    ulimits:
      nofile:
        hard: 1048576
        soft: 1048576
    user: 'nginx:nginx'
    volumes:
      - target: '/tmp'
        tmpfs:
          mode: 01777
        type: 'tmpfs'
      - target: '/run'
        tmpfs:
          mode: 01777
        type: 'tmpfs'
  oracle:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'oracle'
    cap_drop:
      - 'ALL'
    logging:
      driver: 'json-file'
      options:
        max-file: 3
        max-size: '10m'
    networks:
      - 'oracle'
    restart: 'unless-stopped'
    secrets:
      - 'oracle_pwd'
    security_opt:
      - 'no-new-privileges:true'
    stop_grace_period: '60s'
    sysctls:
      - 'net.core.somaxconn=65535'
    ulimits:
      nofile:
        hard: 1048576
        soft: 1048576
    user: 'oracle:oinstall'
    volumes:
      - source: 'oracle_data'
        target: '/opt/oracle/oradata'
        type: 'volume'
  php:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'php'
    cap_drop:
      - 'ALL'
    depends_on:
      oracle:
        condition: 'service_healthy'
      valkey:
        condition: 'service_healthy'
    environment:
      APP_ENV: 'production'
      NODE_ENV: 'production'
      ORACLE_DATABASE: 'FREEPDB1'
      ORACLE_HOST: 'oracle'
      ORACLE_PASSWORD: '/run/secrets/oracle_pwd'
      ORACLE_USER: 'APP'
    healthcheck:
      interval: '10s'
      retries: 3
      start_period: '30s'
      test:
        - 'CMD-SHELL'
        - 'REQUEST_METHOD=GET SCRIPT_NAME=/fpm_ping SCRIPT_FILENAME=/fpm_ping cgi-fcgi -bind -connect localhost:9000 | grep -q pong || exit 1'
      timeout: '5s'
    logging:
      driver: 'json-file'
      options:
        max-file: 3
        max-size: '10m'
    networks:
      - 'oracle'
      - 'php'
      - 'valkey'
    read_only: true
    restart: 'unless-stopped'
    secrets:
      - 'oracle_pwd'
    security_opt:
      - 'no-new-privileges:true'
    stop_grace_period: '60s'
    sysctls:
      - 'net.core.somaxconn=65535'
    ulimits:
      nofile:
        hard: 1048576
        soft: 1048576
    user: 'www-data:www-data'
    volumes:
      - target: '/tmp'
        tmpfs:
          mode: 01777
        type: 'tmpfs'
      - target: '/run'
        tmpfs:
          mode: 01777
        type: 'tmpfs'
  valkey:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'valkey'
    cap_drop:
      - 'ALL'
    healthcheck:
      interval: '10s'
      retries: 3
      start_period: '30s'
      test:
        - 'CMD'
        - 'valkey-cli'
        - 'ping'
      timeout: '5s'
    logging:
      driver: 'json-file'
      options:
        max-file: 3
        max-size: '10m'
    networks:
      - 'valkey'
    restart: 'unless-stopped'
    security_opt:
      - 'no-new-privileges:true'
    stop_grace_period: '60s'
    sysctls:
      - 'net.core.somaxconn=65535'
    ulimits:
      nofile:
        hard: 1048576
        soft: 1048576
    user: 'valkey:valkey'
    volumes:
      - source: 'valkey_data'
        target: '/data'
        type: 'volume'
volumes:
  oracle_data:
  valkey_data:
