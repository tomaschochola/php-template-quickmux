networks:
  devcontainer:
    internal: false
volumes:
  composer-cache:
  npm-cache:
services:
  devcontainer:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'devcontainer'
    command: 'sleep infinity'
    depends_on:
      nginx:
        condition: 'service_healthy'
      oracle:
        condition: 'service_healthy'
      php:
        condition: 'service_healthy'
      valkey:
        condition: 'service_healthy'
    environment:
      APP_ENV: 'local'
      COMPOSER_CACHE_DIR: '/home/devcontainer/.composer/cache'
      NPM_CONFIG_CACHE: '/home/devcontainer/.npm'
      NODE_ENV: 'development'
      ORACLE_DATABASE: 'FREEPDB1'
      ORACLE_HOST: 'oracle'
      ORACLE_PASSWORD: '/run/secrets/oracle_pwd'
      ORACLE_UNIT_USER: 'APP_UNIT'
      ORACLE_USER: 'APP'
    networks:
      - 'devcontainer'
      - 'nginx'
      - 'oracle'
      - 'php'
      - 'valkey'
    secrets:
      - 'oracle_pwd'
    user: 'devcontainer:devcontainer'
    volumes:
      - './:/var/www/html'
      - 'composer-cache:/home/devcontainer/.composer/cache'
      - 'npm-cache:/home/devcontainer/.npm'
  nginx:
    ports:
      - '8080:8080'
    volumes:
      - './:/var/www/html'
  php:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'devcontainer'
    environment:
      APP_ENV: 'local'
      NODE_ENV: 'development'
    volumes:
      - './:/var/www/html'
